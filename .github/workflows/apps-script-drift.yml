name: Apps Script drift check

# Detects edits made directly in the Apps Script editor that never went
# through this repository. Pulls the live project and compares it with `main`.
# Fails (and attaches the diff) when the two differ.
#
# Uses the same repository secrets as the deploy workflow.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # clasp comes from devDependencies, pinned by package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLASPRC_JSON:?Missing CLASPRC_JSON repository secret}"
          : "${APPS_SCRIPT_ID:?Missing APPS_SCRIPT_ID repository secret}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          # scriptExtensions keeps clasp 3 on .gs (its default is .js).
          # Ten sam mechanizm co w deployu: src/ od #105, katalog główny wcześniej.
          if [ -f src/appsscript.json ]; then ROOT_DIR=src; else ROOT_DIR=.; fi
          echo "clasp rootDir: $ROOT_DIR"
          printf '{"scriptId":"%s","rootDir":"%s","scriptExtensions":["gs"]}\n' "$APPS_SCRIPT_ID" "$ROOT_DIR" > .clasp.json

      # Shared with the deploy workflow: clasp pull, trailing-newline
      # normalisation, Version.gs restored from git, git status limited to the
      # sources. See scripts/quality/apps-script-compare.js (unit-tested).
      - name: Pull live project and compare with main
        run: node scripts/quality/apps-script-compare.js --label main --patch apps-script-drift.patch

      - name: Upload drift patch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apps-script-drift
          path: apps-script-drift.patch
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
