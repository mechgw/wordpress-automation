name: PR template

# Sprawdza, czy treść PR-a ma wypełnioną matrycę testów, macierz dowodów
# i linki do issue (#49). Okres obserwacji: check nie jest wymagany przez
# ochronę gałęzi. Drafty są pomijane; PR-y Dependabota mają własny opis
# bez szablonu, więc dostają zwolnienie zamiast czerwonego checku.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-template:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Dependabot exemption
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "PR Dependabota – szablon nie obowiązuje, check zaliczony." >> "$GITHUB_STEP_SUMMARY"

      - name: Check the PR body against the template
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          node scripts/quality/pr-template.js | tee -a "$GITHUB_STEP_SUMMARY"
