name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the coverage gate can diff against the base branch.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate appsscript.json
        run: node -e "JSON.parse(require('fs').readFileSync('src/appsscript.json', 'utf8'))"

      - name: Reject duplicate Apps Script extensions
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(find src -maxdepth 1 -type f -name '*.gs.gs' -print)"
          if [ -n "$bad_files" ]; then
            echo "Found files with duplicated .gs extension:"
            echo "$bad_files"
            exit 1
          fi

      - name: Require at least one .gs source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src/*.gs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .gs files found"
            exit 1
          fi
          printf 'Sources: %s\n' "${files[@]}"

      # ESLint parses every .gs file (so syntax errors fail here too) and checks
      # for undefined identifiers, unused locals and common mistakes, with the
      # Apps Script services declared as globals. See eslint.config.js.
      - name: Lint Apps Script sources
        run: npm run lint

      # Zapadka długu rozmiaru i złożoności (#240): dług może tylko maleć. W tym kroku tylko raport
      # (nie blokuje); miary dołączają osobne zgłoszenia, blokada włącza się osobnym PR.
      # Baza z PR jest porównywana ze stanem bazowym PR (pełna historia z fetch-depth: 0).
      - name: Debt ratchet (report)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/quality/debt-ratchet.js --mode=report --base="$BASE_SHA"
          else
            node scripts/quality/debt-ratchet.js --mode=report --base=none
          fi

      # Unit tests load the .gs files into a VM with stubbed Google services
      # (see test/helpers/gas.js). The gate then enforces per-file thresholds
      # (.quality/coverage-policy.json) and 100% coverage of the *.gs lines
      # changed in this PR (.quality/changed-lines-ignore.json for exceptions).
      - name: Unit tests + coverage gate
        shell: bash
        run: |
          set -euo pipefail
          # The base SHA needs no origin/<branch> ref, only the full history.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run quality:gate -- --changed="base:${{ github.event.pull_request.base.sha }}"
          else
            npm run quality:gate -- --changed=none
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Binarka z wydania, nie gitleaks-action: akcja w repo organizacji wymaga
      # licencji (GITLEAKS_LICENSE). Wersja i SHA-256 jak w CityCouriers/tools
      # (`[tool.gate.gitleaks]`), zgodne z gitleaks_8.30.1_checksums.txt wydania.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Pełna historia osiągalna z HEAD (stąd fetch-depth: 0); znalezisko = kod 1.
      - name: Gitleaks
        run: gitleaks git . --redact --no-banner --no-color --verbose --exit-code 1
