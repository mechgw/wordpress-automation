name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate appsscript.json
        run: node -e "JSON.parse(require('fs').readFileSync('appsscript.json', 'utf8'))"

      - name: Reject duplicate Apps Script extensions
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(find . -maxdepth 1 -type f -name '*.gs.gs' -print)"
          if [ -n "$bad_files" ]; then
            echo "Found files with duplicated .gs extension:"
            echo "$bad_files"
            exit 1
          fi

      - name: Check Apps Script JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.gs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .gs files found"
            exit 1
          fi

          for file in "${files[@]}"; do
            tmp="$(mktemp --suffix=.js)"
            trap 'rm -f "$tmp"' EXIT
            cp "$file" "$tmp"
            echo "Checking $file"
            node --check "$tmp"
            rm -f "$tmp"
            trap - EXIT
          done

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
