name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate appsscript.json
        run: node -e "JSON.parse(require('fs').readFileSync('appsscript.json', 'utf8'))"

      - name: Reject duplicate Apps Script extensions
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(find . -maxdepth 1 -type f -name '*.gs.gs' -print)"
          if [ -n "$bad_files" ]; then
            echo "Found files with duplicated .gs extension:"
            echo "$bad_files"
            exit 1
          fi

      - name: Require at least one .gs source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.gs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .gs files found"
            exit 1
          fi
          printf 'Sources: %s\n' "${files[@]}"

      # ESLint parses every .gs file (so syntax errors fail here too) and checks
      # for undefined identifiers, unused locals and common mistakes, with the
      # Apps Script services declared as globals. See eslint.config.js.
      - name: Lint Apps Script sources
        run: npm run lint

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
