name: Deploy to Apps Script

# Gated deployment of the repository sources to the Apps Script project.
#
# Triggers:
#   - release published  → deploys the released tag (pre-releases are skipped)
#   - workflow_dispatch  → deploys the `deploy_ref` input: `main` (default)
#                          for a hotfix, or a `v*` tag for a rollback. Always
#                          start the run from `main` so this workflow definition
#                          is used; older tags carry older workflow files.
#
# Either way the `production` environment requires a reviewer to approve the
# run before any secret is exposed or any file is pushed, and lint must pass
# before clasp push runs.
#
# Required repository secrets:
#   CLASPRC_JSON    contents of ~/.clasprc.json after `clasp login`
#   APPS_SCRIPT_ID  the Apps Script project id (Project settings → Script ID)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "What to deploy: main, or a release tag such as v2.9.1 to roll back"
        type: string
        default: main
      create_version:
        description: "Also create an immutable Apps Script version after the push"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  push:
    name: clasp push (${{ github.event_name == 'release' && github.event.release.tag_name || inputs.deploy_ref }})
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      # Released tag for release events; the deploy_ref input for manual runs.
      DEPLOY_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.deploy_ref }}
      # Every release gets an immutable Apps Script version; manual runs opt in.
      CREATE_VERSION: ${{ github.event_name == 'release' || inputs.create_version == true }}
    steps:
      - name: Validate deploy ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_REF" in
            main) kind=heads ;;
            v[0-9]*) kind=tags ;;
            *) echo "::error::deploy_ref must be 'main' or a v* release tag, got '$DEPLOY_REF'"; exit 1 ;;
          esac
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/$kind/$DEPLOY_REF" --jq '.object.sha' >/dev/null 2>&1; then
            echo "::error::ref '$DEPLOY_REF' does not exist in $GITHUB_REPOSITORY"; exit 1
          fi
          echo "Deploying $DEPLOY_REF"

      - name: Checkout ${{ env.DEPLOY_REF }}
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Third line of defence: the same tests and coverage thresholds that
      # guard commits (pre-commit) and merges (CI) must pass on the exact ref
      # being deployed, after the production approval and before clasp push.
      - name: Unit tests + coverage thresholds
        run: npm run quality:gate -- --changed=none

      # clasp comes from devDependencies (pinned by package-lock.json, bumped
      # by Dependabot), so every deploy uses the same version.
      - name: clasp version
        run: npx clasp --version

      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLASPRC_JSON:?Missing CLASPRC_JSON repository secret}"
          : "${APPS_SCRIPT_ID:?Missing APPS_SCRIPT_ID repository secret}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          # scriptExtensions keeps clasp 3 on .gs (its default is .js).
          printf '{"scriptId":"%s","rootDir":".","scriptExtensions":["gs"]}\n' "$APPS_SCRIPT_ID" > .clasp.json

      # Version.gs in the repo holds placeholders; the deployed copy carries the
      # tag, commit, time and actor so the sheet menu can show what is live.
      - name: Stamp deployed version into Version.gs
        shell: bash
        # Values go through JSON.stringify, so a quote or backslash in a tag
        # name can never break or inject into the generated JavaScript.
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const v = {
            tag: process.env.DEPLOY_REF,
            commit: execSync('git rev-parse --short HEAD').toString().trim(),
            deployedAt: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
            deployedBy: process.env.GITHUB_ACTOR
          };
          const body = Object.entries(v)
            .map(([k, val]) => `  ${k}: ${JSON.stringify(String(val))}`)
            .join(',\n');
          fs.writeFileSync('Version.gs',
            '/**\n' +
            ' * Wygenerowane przez workflow "Deploy to Apps Script". Nie edytuj ręcznie.\n' +
            ` * Źródło: https://github.com/${process.env.GITHUB_REPOSITORY}/releases\n` +
            ' */\n' +
            `const DEPLOYED_VERSION = {\n${body}\n};\n`);
          EOF
          cat Version.gs
          # Syntax check with the project's ESLint config (node --check rejects .gs).
          npx eslint Version.gs

      - name: Files that will be pushed
        run: npx clasp status

      - name: Push to Apps Script
        run: npx clasp push --force

      - name: Create immutable version
        if: env.CREATE_VERSION == 'true'
        # Use the checked-out commit, not GITHUB_SHA: a manual run dispatched
        # from another ref would otherwise label the version with the wrong SHA.
        run: npx clasp version "${DEPLOY_REF} ($(git rev-parse --short HEAD)) deployed from GitHub by ${GITHUB_ACTOR}"

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
