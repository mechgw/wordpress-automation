name: Deploy to Apps Script

# Gated deployment of the repository sources to the Apps Script project.
#
# Triggers:
#   - release published  → deploys the released tag (pre-releases are skipped)
#   - workflow_dispatch  → deploys `main` on demand
#
# Either way the `production` environment requires a reviewer to approve the
# run before any secret is exposed or any file is pushed, and lint must pass
# before clasp push runs.
#
# Required repository secrets:
#   CLASPRC_JSON    contents of ~/.clasprc.json after `clasp login`
#   APPS_SCRIPT_ID  the Apps Script project id (Project settings → Script ID)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      create_version:
        description: "Also create an immutable Apps Script version after the push"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  push:
    name: clasp push (${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }})
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      # Released tag for release events, main for manual runs.
      DEPLOY_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
      # Every release gets an immutable Apps Script version; manual runs opt in.
      CREATE_VERSION: ${{ github.event_name == 'release' || inputs.create_version == true }}
    steps:
      - name: Checkout ${{ env.DEPLOY_REF }}
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install clasp
        run: npm install -g @google/clasp@3

      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLASPRC_JSON:?Missing CLASPRC_JSON repository secret}"
          : "${APPS_SCRIPT_ID:?Missing APPS_SCRIPT_ID repository secret}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          # scriptExtensions keeps clasp 3 on .gs (its default is .js).
          printf '{"scriptId":"%s","rootDir":".","scriptExtensions":["gs"]}\n' "$APPS_SCRIPT_ID" > .clasp.json

      - name: Files that will be pushed
        run: clasp status

      - name: Push to Apps Script
        run: clasp push --force

      - name: Create immutable version
        if: env.CREATE_VERSION == 'true'
        # Use the checked-out commit, not GITHUB_SHA: a manual run dispatched
        # from another ref would otherwise label the version with the wrong SHA.
        run: clasp version "${DEPLOY_REF} ($(git rev-parse --short HEAD)) deployed from GitHub by ${GITHUB_ACTOR}"

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
