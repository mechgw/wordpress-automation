name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
filter-by-commitish: true
commitish: main

categories:
  - title: "🚀 Features"
    semver-increment: minor
    exclusive: true
    when:
      - conventional:
          types: [feat, new]
      - label: enhancement

  - title: "🐛 Bug Fixes"
    semver-increment: patch
    exclusive: true
    when:
      - conventional:
          types: [fix, bug, hotfix]
      - label: bug

  - title: "📝 Documentation"
    semver-increment: patch
    exclusive: true
    when:
      - conventional:
          type: docs
      - label: documentation

  - title: "🧹 Maintenance"
    semver-increment: patch
    exclusive: true
    when:
      conventional:
        types: [chore, refactor, style, test, ci]

  - title: "📦 Other Changes"
    semver-increment: patch

# Keep familiar GitHub labels for quick visual triage. SemVer resolution above also
# understands Conventional Commit-style PR titles directly, so maintenance PRs do
# not require extra custom labels.
autolabeler:
  - label: "enhancement"
    regex:
      - '^(feat|new)(\(|:|\s|$)'
    branch:
      - '/^feat\//'
  - label: "bug"
    regex:
      - '^(fix|bug|hotfix)(\(|:|\s|$)'
    branch:
      - '/^(fix|hotfix)\//'
  - label: "documentation"
    regex:
      - '^docs(\(|:|\s|$)'
    branch:
      - '/^docs\//'

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"

template: |
  ## What's changed in $RESOLVED_VERSION

  $CHANGES

  ---
  Thanks to everyone who contributed.
